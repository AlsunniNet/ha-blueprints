blueprint:
  name: Targeted Occupancy Light with Manual Override, Delay & Schedule (3.0.0)
  description: >
    Controls targeted lights based on area occupancy with a customizable turn-off delay, time window, 
    and manual override helper. Option to automatically disable override when all monitored lights are turned off manually.
  domain: automation
  input:
    target_area:
      name: Occupancy Area
      description: The area containing the occupancy sensors.
      selector:
        area:
    target_lights:
      name: Targeted Lights
      description: The target lights (entities, devices, or areas) to turn on/off with occupancy.
      selector:
        target:
          entity:
            domain: light
    override_helper:
      name: Override Switch / Helper
      description: An input_boolean or switch that, when ON, prevents automated light toggling.
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    monitored_lights:
      name: Monitored Lights for Manual Control
      description: The individual light entities to monitor for physical/manual toggles.
      selector:
        entity:
          domain: light
          multiple: true
    auto_reset_override:
      name: Auto Disable Override when All Lights Off
      description: Turn off the manual override helper automatically if all monitored lights are turned off manually.
      default: false
      selector:
        boolean:
    off_delay:
      name: Turn-off Delay
      description: Time to wait after occupancy clears before turning lights off.
      default:
        hours: 0
        minutes: 30
        seconds: 0
      selector:
        duration:
    time_start:
      name: Allowed Start Time
      description: Earliest time occupancy automation can turn on lights.
      default: "07:30:00"
      selector:
        time:
    time_end:
      name: Allowed End Time
      description: Latest time occupancy automation can turn on lights.
      default: "17:00:00"
      selector:
        time:

trigger:
  # Trigger 1: Occupancy Detected
  - trigger: occupancy.detected
    target:
      area_id: !input target_area
    options:
      behavior: first
    id: "on"

  # Trigger 2: Occupancy Cleared
  - trigger: occupancy.cleared
    target:
      area_id: !input target_area
    options:
      behavior: all
    id: "off"

  # Trigger 3: Light State Change (Manual Detection)
  - trigger: state
    entity_id: !input monitored_lights
    id: "manual_toggle"

condition: []

action:
  - choose:
      # Branch 1: Handle Manual Override Detection & Optional Reset
      - conditions:
          - condition: trigger
            id: "manual_toggle"
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.parent_id == none and
                 trigger.to_state.context.user_id != none }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ auto_reset_enabled }}"
                  - condition: template
                    value_template: >-
                      {% set lights = monitored_list %}
                      {{ expand(lights) | selectattr('state', 'eq', 'on') | list | count == 0 }}
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: !input override_helper
            default:
              - action: homeassistant.turn_on
                target:
                  entity_id: !input override_helper

      # Branch 2: Handle Occupancy ON (Checks Override AND Time Window)
      - conditions:
          - condition: trigger
            id: "on"
          - condition: state
            entity_id: !input override_helper
            state: "off"
          - condition: time
            after: !input time_start
            before: !input time_end
        sequence:
          - action: light.turn_on
            target: !input target_lights

      # Branch 3: Handle Occupancy OFF (Runs Delay before turning off)
      - conditions:
          - condition: trigger
            id: "off"
          - condition: state
            entity_id: !input override_helper
            state: "off"
        sequence:
          - delay: !input off_delay
          - action: light.turn_off
            target: !input target_lights

variables:
  auto_reset_enabled: !input auto_reset_override
  monitored_list: !input monitored_lights

mode: restart
