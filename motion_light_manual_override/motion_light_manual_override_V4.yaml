blueprint:
  name: Targeted Occupancy Light with Manual Override, Delay & Schedule (4.2.5)
  description: >
    Automates target lights based on motion or occupancy detection with scheduling controls, 
    a customizable off-delay, and a manual override helper.
  domain: automation
  input:
    target_area:
      name: Occupancy Target
      description: Choose the area, devices, or binary sensors used to detect occupancy or motion.
      selector:
        target:
          entity:
            domain:
              - binary_sensor
            device_class:
              - occupancy
              - motion
    target_lights:
      name: Targeted Lights
      description: Select the lights, light groups, devices, or areas to automatically control.
      selector:
        target:
          entity:
            domain: light
    override_helper:
      name: Override Switch / Helper
      description: >
        An input_boolean or switch helper entity that, when ON, temporarily suspends automatic light triggers.
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    monitored_lights:
      name: Monitored Lights for Manual Control
      description: >
        Select individual light entities to monitor for physical/manual toggles to engage override.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    auto_reset_override:
      name: Auto Disable Override when Occupancy Clears
      description: >
        Automatically turns off the manual override helper once occupancy clears and monitored lights turn off.
      default: false
      selector:
        boolean:
    off_delay:
      name: Turn-off Delay
      description: How long to wait after occupancy clears before turning off the lights.
      default:
        hours: 0
        minutes: 30
        seconds: 0
      selector:
        duration:
    time_start:
      name: Allowed Start Time
      description: The daily start time after which occupancy detection can turn on lights.
      default: "00:00:00"
      selector:
        time:
    time_end:
      name: Allowed End Time
      description: The daily end time after which occupancy detection will no longer turn on lights.
      default: "23:59:59"
      selector:
        time:
    
    # Optional Feature Toggles
    enable_trigger_override_off:
      name: "Trigger: Override Turned OFF"
      description: "Triggers an occupancy check when the override helper is turned off."
      default: false
      selector:
        boolean:
    enable_trigger_startup:
      name: "Trigger: Home Assistant Startup / Reload"
      description: "Re-evaluates occupancy when Home Assistant reboots."
      default: false
      selector:
        boolean:
    enable_trigger_time_start:
      name: "Trigger: Schedule Start Boundary"
      description: "Turns on lights at the exact start time if room is occupied."
      default: false
      selector:
        boolean:
    enable_trigger_lux:
      name: "Trigger: Illuminance (Lux) Threshold"
      description: "Turns on lights mid-occupancy if light levels drop below threshold."
      default: false
      selector:
        boolean:
    lux_sensor:
      name: Illuminance Sensor
      description: Lux sensor entity used to evaluate ambient light levels.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    lux_threshold:
      name: Illuminance Threshold (Lux)
      description: Minimum light level in lx below which lights can turn on.
      default: 50
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: lx

trigger:
  # Base Triggers
  - trigger: occupancy.detected
    target: !input target_area
    options:
      behavior: first
    id: "on"

  - trigger: occupancy.cleared
    target: !input target_area
    options:
      behavior: all
    id: "off"

  - trigger: state
    entity_id: !input monitored_lights
    id: "manual_toggle"

  # Optional Triggers
  - trigger: state
    entity_id: !input override_helper
    to: "off"
    id: "override_turned_off"

  - trigger: homeassistant
    event: start
    id: "ha_startup"

  - trigger: event
    event_type: automation_reloaded
    id: "ha_startup"

  - trigger: time
    at: !input time_start
    id: "time_start_reached"

  - trigger: numeric_state
    entity_id: !input lux_sensor
    below: !input lux_threshold
    id: "lux_below_threshold"

condition: []

action:
  - choose:
      # Branch 1: Manual Override Handler
      - conditions:
          - condition: trigger
            id: "manual_toggle"
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.parent_id == none and
                 trigger.to_state.context.user_id != none }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input override_helper

      # Branch 2: Turn Lights ON
      - conditions:
          - condition: state
            entity_id: !input override_helper
            state: "off"
          - condition: time
            after: !input time_start
            before: !input time_end
          - condition: template
            value_template: >-
              {% set trig = trigger.id %}
              {% set is_valid_trig = (trig == 'on'
                 or (trig == 'override_turned_off' and trg_override_off)
                 or (trig == 'ha_startup' and trg_startup)
                 or (trig == 'time_start_reached' and trg_time_start)
                 or (trig == 'lux_below_threshold' and trg_lux)) %}
              {% if not is_valid_trig %}
                false
              {% elif trig == 'on' %}
                true
              {% else %}
                {% set t = target_area_var %}
                {% set entities = t.entity_id if t.entity_id is defined else [] %}
                {% set entities = [entities] if entities is string else entities %}
                {% set area_e = area_entities(t.area_id) if t.area_id is defined else [] %}
                {% set dev_e = device_entities(t.device_id) if t.device_id is defined else [] %}
                {% set all_sensors = entities + area_e + dev_e %}
                {{ expand(all_sensors) | selectattr('domain', 'eq', 'binary_sensor') | selectattr('state', 'eq', 'on') | list | count > 0 }}
              {% endif %}
        sequence:
          - action: light.turn_on
            target: !input target_lights

      # Branch 3: Turn Lights OFF
      - conditions:
          - condition: trigger
            id: "off"
        sequence:
          - delay: !input off_delay
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input override_helper
                    state: "off"
                sequence:
                  - action: light.turn_off
                    target: !input target_lights
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ auto_reset_enabled }}"
                  - condition: template
                    value_template: >-
                      {% set lights = monitored_list %}
                      {{ expand(lights) | selectattr('state', 'eq', 'on') | list | count == 0 }}
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: !input override_helper

variables:
  auto_reset_enabled: !input auto_reset_override
  monitored_list: !input monitored_lights
  target_area_var: !input target_area
  trg_override_off: !input enable_trigger_override_off
  trg_startup: !input enable_trigger_startup
  trg_time_start: !input enable_trigger_time_start
  trg_lux: !input enable_trigger_lux

mode: restart
