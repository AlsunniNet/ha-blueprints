blueprint:
  name: Area Occupancy Light with Manual Override, Delay & Schedule (2.0.2)
  description: >
    Controls lights in an area based on occupancy with a customizable turn-off delay and time window.
    If a light is toggled manually by a user, a manual override helper turns ON to suspend automation.
  domain: automation
  input:
    target_area:
      name: Target Area
      description: The area containing the occupancy sensors and lights.
      selector:
        area:
    override_helper:
      name: Override Switch / Helper
      description: An input_boolean that, when ON, prevents automated light toggling.
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    monitored_lights:
      name: Monitored Lights for Manual Control
      description: The individual light entities to monitor for physical/manual toggles.
      selector:
        entity:
          domain: light
          multiple: true
    off_delay:
      name: Turn-off Delay
      description: Time to wait after occupancy clears before turning lights off.
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
    time_start:
      name: Allowed Start Time
      description: Earliest time occupancy automation can turn on lights.
      default: "00:00:00"
      selector:
        time:
    time_end:
      name: Allowed End Time
      description: Latest time occupancy automation can turn on lights.
      default: "23:59:59"
      selector:
        time:

trigger:
  # Trigger 1: Occupancy Detected
  - trigger: occupancy.detected
    target:
      area_id: !input target_area
    options:
      behavior: first
    id: "on"

  # Trigger 2: Occupancy Cleared
  - trigger: occupancy.cleared
    target:
      area_id: !input target_area
    options:
      behavior: all
    id: "off"

  # Trigger 3: Light State Change (Manual Detection)
  - trigger: state
    entity_id: !input monitored_lights
    id: "manual_toggle"

condition: []

action:
  - choose:
      # Branch 1: Handle Manual Override Detection
      - conditions:
          - condition: trigger
            id: "manual_toggle"
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.parent_id == none and
                 trigger.to_state.context.user_id != none }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input override_helper

      # Branch 2: Handle Occupancy ON (Checks Override AND Time Window)
      - conditions:
          - condition: trigger
            id: "on"
          - condition: state
            entity_id: !input override_helper
            state: "off"
          - condition: time
            after: !input time_start
            before: !input time_end
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area

      # Branch 3: Handle Occupancy OFF (Runs Delay before turning off)
      - conditions:
          - condition: trigger
            id: "off"
          - condition: state
            entity_id: !input override_helper
            state: "off"
        sequence:
          - delay: !input off_delay
          - action: light.turn_off
            target:
              area_id: !input target_area

mode: restart
