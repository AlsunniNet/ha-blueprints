# Version: 1.0.7
blueprint:
  name: AlsunniNet | Motion Light with Manual Override (v1.0.7)
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If a target light is manually controlled (via wall switch or UI),
    the automation stops and leaves the lights in their manual state until motion clears.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Targeted Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    delay_off:
      name: Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off Targeted Lights (Range: 0 to 480 minutes)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider

variables:
  target_lights_var: !input target_lights

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # 1. If any light was manually turned off while motion was active/clearing, do NOT turn them back on with new motion.
  # Stop execution and let the manual state stand.
  - if:
      - condition: template
        value_template: >-
          {{ expand(target_lights_var) | selectattr('state', 'eq', 'off') | list | count == (expand(target_lights_var) | list | count) and (this.state == 'on') }}
    then:
      - stop: "Manual off override active. Ignoring new motion."

  # 2. Turn on targeted lights
  - action: light.turn_on
    target: !input target_lights

  # 3. Capture baseline state AFTER turning lights on to avoid self-triggering manual override
  - delay:
      milliseconds: 500
  - variables:
      baseline_states: >-
        {{ expand(target_lights_var) | map(attribute='state') | list }}

  # 4. Wait for motion to clear completely
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # 5. Wait off-delay OR detect manual wall switch / UI state toggles
  - wait_for_trigger:
      - platform: template
        value_template: >-
          {{ expand(target_lights_var) | map(attribute='state') | list != baseline_states }}
    timeout:
      minutes: !input delay_off
    continue_on_timeout: true

  # 6. Turn off lights ONLY if the delay timed out without manual intervention
  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: light.turn_off
        target: !input target_lights
