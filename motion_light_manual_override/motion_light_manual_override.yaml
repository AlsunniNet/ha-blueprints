blueprint:
  name: Motion-Activated Light with Manual Switch Override
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If the room light is manually changed, automatic turn-off is cancelled.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select the sensor(s) that trigger the light.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    target_light:
      name: Target Light
      description: Select the specific light entity for this room.
      selector:
        entity:
          domain: light
    delay_duration:
      name: Off Delay Duration
      description: How long to keep the light on after motion stops (0 minutes to 8 hours).
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
          enable_day: false

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # Turn on the room's light
  - service: light.turn_on
    target:
      entity_id: !input target_light

  # Wait until all motion sensors in this room return to off
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # Wait for the delay timer, OR abort if this specific light entity changes state
  - wait_for_trigger:
      - platform: state
        entity_id: !input target_light
    timeout: !input delay_duration
    continue_on_timeout: true

  # Only turn off if the timeout expired naturally without manual intervention on this light
  - if:
      - condition: template
        value_template: "{{ wait.trigger is none }}"
    then:
      - service: light.turn_off
        target:
          entity_id: !input target_light
