# Version: 1.0.9
blueprint:
  name: AlsunniNet | Motion Light with Manual Override (v1.0.9)
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If a target light is manually controlled (via wall switch or UI)
    while active, the off-delay is canceled and lights remain in their manual state.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Targeted Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    delay_off:
      name: Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off Targeted Lights (Range: 0 to 480 minutes)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # 1. Turn on targeted lights on motion
  - action: light.turn_on
    target: !input target_lights

  # 2. Wait 1 second and capture baseline light states
  - delay:
      seconds: 1
  - variables:
      target_lights_var: !input target_lights
      baseline_states: >-
        {{ expand(target_lights_var) | map(attribute='state') | list }}

  # 3. Wait for motion to clear completely
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # 4. Wait off-delay OR detect manual switch changes during countdown
  - wait_for_trigger:
      - platform: template
        value_template: >-
          {{ expand(target_lights_var) | map(attribute='state') | list != baseline_states }}
    timeout:
      minutes: !input delay_off
    continue_on_timeout: true

  # 5. Turn off lights ONLY if wait_for_trigger timed out naturally without manual switch changes
  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: light.turn_off
        target: !input target_lights
