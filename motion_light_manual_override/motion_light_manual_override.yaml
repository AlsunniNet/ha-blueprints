blueprint:
  name: Area Occupancy Light with Manual Override (v2.0.1)
  description: >
    Controls lights in an area based on occupancy. If a light is toggled manually
    by a physical user, it turns on a manual override helper to suspend automated control.
  domain: automation
  input:
    target_area:
      name: Target Area
      description: The area containing the occupancy sensors and lights.
      selector:
        area:
    override_helper:
      name: Override Switch / Helper
      description: An input_boolean that, when ON, prevents automated light toggling.
      selector:
        entity:
          domain: input_boolean
    monitored_lights:
      name: Monitored Lights for Manual Control
      description: The individual light entities to monitor for physical/manual toggles.
      selector:
        entity:
          domain: light
          multiple: true

trigger:
  # Trigger 1: Occupancy Detected
  - trigger: occupancy.detected
    target:
      area_id: !input target_area
    options:
      behavior: first
    id: "on"

  # Trigger 2: Occupancy Cleared
  - trigger: occupancy.cleared
    target:
      area_id: !input target_area
    options:
      behavior: all
      for:
        hours: 0
        minutes: 0
        seconds: 0
    id: "off"

  # Trigger 3: Light State Change (Manual Detection)
  - trigger: state
    entity_id: !input monitored_lights
    id: "manual_toggle"

condition: []

action:
  - choose:
      # Branch 1: Handle Manual Override Detection
      - conditions:
          - condition: trigger
            id: "manual_toggle"
          - condition: template
            value_template: >-
              {{ trigger.to_state.context.parent_id == none and
                 trigger.to_state.context.user_id != none }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input override_helper

      # Branch 2: Handle Occupancy ON
      - conditions:
          - condition: trigger
            id: "on"
          - condition: state
            entity_id: !input override_helper
            state: "off"
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area

      # Branch 3: Handle Occupancy OFF
      - conditions:
          - condition: trigger
            id: "off"
          - condition: state
            entity_id: !input override_helper
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              area_id: !input target_area

mode: single
