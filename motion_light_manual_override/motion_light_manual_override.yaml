blueprint:
  name: AlsunniNet | Motion Light with Manual Override (v1.0.1)
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If a light is manually controlled from a physical wall switch,
    the automation stops and leaves the light in its manual state.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Targeted Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    delay_off:
      name: Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off Targeted Lights (Range: 0 to 480 minutes / max 8 hours)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # Turn on the targeted lights
  - action: light.turn_on
    target: !input target_lights

  # Wait for motion to clear
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # Wait for off delay, but detect if any target light was turned off manually
  - wait_for_trigger:
      - platform: event
        event_type: state_changed
        event_data:
          entity_id: !input target_lights
      timeout:
        minutes: !input delay_off
      continue_on_timeout: true

  # Only turn off if no manual override occurred
  - if:
      - condition: template
        value_template: >
          {% set manual_off = false %}
          {% for light in states['light'] %}
            {% if light.entity_id in [entity.id for entity in !input target_lights] %}
              {% if light.state == 'off' %}
                {% set manual_off = true %}
                {% break %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ manual_off }}
      then:
        # If manually turned off, skip
        pass
      else:
        # If not manually turned off, turn off
        - action: light.turn_off
          target: !input target_lights
