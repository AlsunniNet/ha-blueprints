# Version: 1.0.11
blueprint:
  name: AlsunniNet | Motion Light with Manual Override (v1.0.11)
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If a target light is manually controlled (wall switch, UI toggle, or dimming),
    the automation stops and respects the manual override even if new motion occurs.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Targeted Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    delay_off:
      name: Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off Targeted Lights (Range: 0 to 480 minutes)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider

variables:
  target_lights_var: !input target_lights

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # 1. Check if any target light was modified by a user (context.user_id is present)
  # If a manual interaction occurred while lights were active, stop the script so motion doesn't override it.
  - if:
      - condition: template
        value_template: >-
          {{ expand(target_lights_var) | selectattr('context.user_id', 'defined') | selectattr('context.user_id', 'ne', none) | list | count > 0 }}
    then:
      - stop: "Manual override detected via user interaction. Leaving lights in current manual state."

  # 2. Turn on targeted lights
  - action: light.turn_on
    target: !input target_lights

  # 3. Settle period to let automation state changes settle
  - delay:
      seconds: 2

  # 4. Capture baseline update timestamps
  - variables:
      baseline_timestamps: >-
        {{ expand(target_lights_var) | map(attribute='last_updated') | list }}

  # 5. Wait for motion to clear completely
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # 6. Wait off-delay OR detect manual switch/UI attribute changes
  - wait_for_trigger:
      - platform: template
        value_template: >-
          {{ expand(target_lights_var) | map(attribute='last_updated') | list != baseline_timestamps }}
    timeout:
      minutes: !input delay_off
    continue_on_timeout: true

  # 7. Turn off lights ONLY if wait_for_trigger timed out naturally without manual interaction
  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: light.turn_off
        target: !input target_lights
