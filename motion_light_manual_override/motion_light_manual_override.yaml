# Version: 1.0.10
blueprint:
  name: AlsunniNet | Motion Light with Manual Override (v1.0.10)
  description: >
    Turns on selected light(s) when motion/occupancy is detected, and turns them off
    after a customizable delay. If a target light is manually controlled (wall switch, UI toggle, or dimming),
    the off-delay is canceled and lights remain in their manual state until fresh motion occurs.
  domain: automation
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Targeted Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    delay_off:
      name: Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off Targeted Lights (Range: 0 to 480 minutes)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"

action:
  # 1. Turn on targeted lights
  - action: light.turn_on
    target: !input target_lights

  # 2. Settle period to let automation-driven state changes register
  - delay:
      seconds: 2

  # 3. Capture baseline update timestamps of target lights
  - variables:
      target_lights_var: !input target_lights
      baseline_timestamps: >-
        {{ expand(target_lights_var) | map(attribute='last_updated') | list }}

  # 4. Wait for motion to clear completely
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_sensors
        to: "off"

  # 5. Wait off-delay OR detect manual switch/UI attribute changes
  - wait_for_trigger:
      - platform: template
        value_template: >-
          {{ expand(target_lights_var) | map(attribute='last_updated') | list != baseline_timestamps }}
    timeout:
      minutes: !input delay_off
    continue_on_timeout: true

  # 6. Turn off lights ONLY if wait_for_trigger timed out naturally without manual interaction
  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: light.turn_off
        target: !input target_lights
