blueprint:
  name: AlsunniNet - Staggered Motion Light
  description: >
    Turns on selected lights (including optional mode lights) when motion or occupancy is detected across one or multiple sensors.
    When motion clears, turns off the first required light target and an optional second light target after two separate customizable delays in minutes (0 to 480 min / up to 8 hours).
    Optionally turns off all remaining Standard Lights after an additional customizable delay while protecting Mode Lights from being turned off.
    Optionally flashes a designated light target (off for 1s, then on) if the room remains continuously occupied for a set interval (1 to 240 min / up to 4 hours).
    Includes a configurable time condition (defaults to all day, every day).
  domain: automation
  source_url: https://github.com/AlsunniNet/ha-blueprints/blob/main/staggered_motion_light/staggered_motion_light.yaml
  author: AlsunniNet
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Standard Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    light_1_off:
      name: First Light Target to Turn Off (Required)
      description: Light target (from standard lights) to turn off after First Off Delay.
      selector:
        target:
          entity:
            domain: light
    delay_1:
      name: First Off Delay (Minutes)
      description: "Minutes to wait after motion clears before turning off First Light Target (Range: 0 to 480 minutes / max 8 hours)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider
    light_2_off:
      name: Second Light Target to Turn Off (Optional)
      description: Optional light target (from standard lights) to turn off after Second Off Delay.
      default: {}
      selector:
        target:
          entity:
            domain: light
    delay_2:
      name: Second Off Delay (Additional Minutes)
      description: "Additional minutes to wait after First Light Target turns off before turning off Second Light Target (Range: 0 to 480 minutes / max 8 hours)."
      default: 15
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider
    turn_off_remaining_target_lights:
      name: Turn Off All Remaining Standard Lights (Optional)
      description: When enabled, turns off any standard lights that were not covered in First or Second Light Targets at the end of the sequence (Mode Lights remain ON).
      default: false
      selector:
        boolean: {}
    delay_remaining:
      name: Delay Before Turning Off Remaining Standard Lights (Additional Minutes)
      description: "Additional minutes to wait after Second Light Target turns off before turning off remaining Standard Lights (Range: 0 to 480 minutes / max 8 hours)."
      default: 30
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider
    # ----- TIME CONDITION (explicit, no list) -----
    time_after:
      name: Time Condition - After
      description: Start of the active window (time of day).
      default: "00:00:00"
      selector:
        time: {}
    time_before:
      name: Time Condition - Before
      description: End of the active window (time of day).
      default: "23:59:59"
      selector:
        time: {}
    time_weekdays:
      name: Time Condition - Active Days
      description: Select which days of the week this automation should run.
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      selector:
        select:
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
          multiple: true
    # ----- END TIME CONDITION -----
    mode_lights:
      name: Mode / Always-On Lights (Optional)
      description: Accent or mode lights turned on with motion that remain ON when motion clears (protected from turning off).
      default: {}
      selector:
        target:
          entity:
            domain: light
    flash_light:
      name: Occupancy Flash Alert Light (Optional)
      description: Select light target to flash when occupancy alert triggers. Leave empty to disable occupancy alert.
      default: {}
      selector:
        target:
          entity:
            domain: light
    occupancy_alert_enabled:
      name: Enable Occupancy Alert
      description: Toggle to enable/disable the occupancy flash alert.
      default: false
      selector:
        boolean: {}
    occupancy_alert_interval:
      name: Occupancy Warning Interval (Minutes)
      description: >
        Minutes of continuous occupancy before flashing (Range: 1 to 240 minutes / max 4 hours). 
        ⚠️ WARNING: This value MUST be LESS THAN First Off Delay (delay_1), otherwise the alert will be ignored.
      default: 120
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: minutes
          mode: slider

# ----- ROOT-LEVEL SETTINGS -----
# No alias template – you can rename the automation manually after creation.
mode: restart
max_exceeded: silent

variables:
  motion_sensors_var: !input motion_sensors
  target_lights_target: !input target_lights
  light_1_off_target: !input light_1_off
  light_2_off_target: !input light_2_off
  turn_off_remaining_var: !input turn_off_remaining_target_lights
  mode_lights_target: !input mode_lights
  flash_light_var: !input flash_light
  raw_delay_1: !input delay_1
  raw_delay_2: !input delay_2
  raw_delay_remaining: !input delay_remaining
  raw_occupancy_interval: !input occupancy_alert_interval
  occupancy_alert_enabled_var: !input occupancy_alert_enabled

  delay_1_var: "{{ (raw_delay_1 | int(10)) | clamp(0, 480) }}"
  delay_2_var: "{{ (raw_delay_2 | int(5)) | clamp(0, 480) }}"
  delay_remaining_var: "{{ (raw_delay_remaining | int(0)) | clamp(0, 480) }}"
  occupancy_alert_interval_var: "{{ (raw_occupancy_interval | int(5)) | clamp(1, 240) }}"

  # Build the time condition as a single dictionary
  time_condition_var:
    condition: time
    after: !input time_after
    before: !input time_before
    weekday: !input time_weekdays

  # Extract Mode Lights entity IDs
  mode_light_entities: >
    {% set t = mode_lights_target %}
    {% if t is mapping %}
      {% set e = t.get('entity_id', []) %}
      {% set e = [e] if e is string else e %}
      {% set d = t.get('device_id', []) %}
      {% set d = [d] if d is string else d %}
      {% set d_entities = d | map('device_entities') | sum(start=[]) %}
      {% set a = t.get('area_id', []) %}
      {% set a = [a] if a is string else a %}
      {% set a_entities = a | map('area_entities') | sum(start=[]) %}
      {{ (e + d_entities + a_entities) | select('match', '^light\\.') | unique | list }}
    {% else %}
      []
    {% endif %}

  # Extract Target Lights entity IDs
  target_light_entities: >
    {% set t = target_lights_target %}
    {% if t is mapping %}
      {% set e = t.get('entity_id', []) %}
      {% set e = [e] if e is string else e %}
      {% set d = t.get('device_id', []) %}
      {% set d = [d] if d is string else d %}
      {% set d_entities = d | map('device_entities') | sum(start=[]) %}
      {% set a = t.get('area_id', []) %}
      {% set a = [a] if a is string else a %}
      {% set a_entities = a | map('area_entities') | sum(start=[]) %}
      {{ (e + d_entities + a_entities) | select('match', '^light\\.') | unique | list }}
    {% else %}
      []
    {% endif %}

  # Filter Light 1 target to exclude Mode Lights
  filtered_light_1: >
    {% set t = light_1_off_target %}
    {% if t is mapping %}
      {% set e = t.get('entity_id', []) %}
      {% set e = [e] if e is string else e %}
      {% set d = t.get('device_id', []) %}
      {% set d = [d] if d is string else d %}
      {% set d_entities = d | map('device_entities') | sum(start=[]) %}
      {% set a = t.get('area_id', []) %}
      {% set a = [a] if a is string else a %}
      {% set a_entities = a | map('area_entities') | sum(start=[]) %}
      {% set all_e = (e + d_entities + a_entities) | select('match', '^light\\.') | unique | list %}
      {{ all_e | reject('in', mode_light_entities) | list }}
    {% else %}
      []
    {% endif %}

  # Filter Light 2 target to exclude Mode Lights
  filtered_light_2: >
    {% set t = light_2_off_target %}
    {% if t is mapping %}
      {% set e = t.get('entity_id', []) %}
      {% set e = [e] if e is string else e %}
      {% set d = t.get('device_id', []) %}
      {% set d = [d] if d is string else d %}
      {% set d_entities = d | map('device_entities') | sum(start=[]) %}
      {% set a = t.get('area_id', []) %}
      {% set a = [a] if a is string else a %}
      {% set a_entities = a | map('area_entities') | sum(start=[]) %}
      {% set all_e = (e + d_entities + a_entities) | select('match', '^light\\.') | unique | list %}
      {{ all_e | reject('in', mode_light_entities) | list }}
    {% else %}
      []
    {% endif %}

  # Calculate any leftover Standard Lights (excluding Mode Lights & already turned-off lights)
  remaining_standard_lights: >
    {% set turned_off = filtered_light_1 + filtered_light_2 + mode_light_entities %}
    {{ target_light_entities | reject('in', turned_off) | list }}

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: 'on'
    id: motion_on
  - platform: state
    entity_id: !input motion_sensors
    to: 'off'
    id: motion_off
  - platform: state
    entity_id: !input motion_sensors
    to: 'on'
    for:
      minutes: !input occupancy_alert_interval
    id: occupancy_alert

action:
  - choose:
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: motion_on
              - "{{ time_condition_var }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ mode_lights_target != {} and mode_lights_target != none }}"
                sequence:
                  - action: light.turn_on
                    target: !input mode_lights

      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: >
              {% if motion_sensors_var is string %}
                {{ is_state(motion_sensors_var, 'off') }}
              {% else %}
                {{ expand(motion_sensors_var) | selectattr('state', 'eq', 'on') | list | length == 0 }}
              {% endif %}
        sequence:
          - delay:
              minutes: "{{ delay_1_var }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ filtered_light_1 | length > 0 }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ filtered_light_1 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ filtered_light_2 | length > 0 }}"
                sequence:
                  - delay:
                      minutes: "{{ delay_2_var }}"
                  - action: light.turn_off
                    target:
                      entity_id: "{{ filtered_light_2 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ turn_off_remaining_var and remaining_standard_lights | length > 0 }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ delay_remaining_var > 0 }}"
                        sequence:
                          - delay:
                              minutes: "{{ delay_remaining_var }}"
                  - action: light.turn_off
                    target:
                      entity_id: "{{ remaining_standard_lights }}"
          - stop: "Automation completed after final light off delay."

      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: occupancy_alert
              - "{{ time_condition_var }}"
              - condition: template
                value_template: "{{ flash_light_var != {} and flash_light_var != none and occupancy_alert_enabled_var }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ occupancy_alert_interval_var < delay_1_var }}"
                sequence:
                  - action: light.turn_off
                    target: !input flash_light
                  - delay:
                      seconds: 1
                  - action: light.turn_on
                    target: !input flash_light
            default:
              - action: system_log.write
                data:
                  level: warning
                  message: >
                    Occupancy Alert skipped: Occupancy Warning Interval ({{ occupancy_alert_interval_var }}m) 
                    must be LESS THAN First Off Delay ({{ delay_1_var }}m).