blueprint:
  name: Staggered Motion Light with Mode Lights & Occupancy Warning
  description: >
    Turns on selected lights (including optional mode lights) when motion or occupancy is detected across one or multiple sensors.
    When motion clears, turns off the first required light target and an optional second light target after two separate customizable delays in minutes (up to 8 hours / 480 min).
    Optionally flashes a designated light target (off for 1s, then on) if the room remains continuously occupied for a set interval (up to 4 hours / 240 min).
  domain: automation
  source_url: https://github.com/AlsunniNet/ha-blueprints/blob/main/staggered_motion_light/staggered_motion_light.yaml
  author: AlsunniNet
  input:
    motion_sensors:
      name: Motion / Occupancy Sensors
      description: Select one or multiple binary sensors detecting motion or occupancy.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    target_lights:
      name: Standard Lights (Turn On)
      description: Regular lights turned on when motion is detected.
      selector:
        target:
          entity:
            domain: light
    light_1_off:
      name: First Light Target to Turn Off (Required)
      description: Light target (from standard lights) to turn off after First Off Delay.
      selector:
        target:
          entity:
            domain: light
    delay_1:
      name: First Off Delay (Minutes)
      description: Minutes to wait after motion clears before turning off First Light Target (0 to 480 minutes / 8 hours).
      default: 10
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider
    light_2_off:
      name: Second Light Target to Turn Off (Optional)
      description: Optional light target (from standard lights) to turn off after Second Off Delay.
      default: {}
      selector:
        target:
          entity:
            domain: light
    delay_2:
      name: Second Off Delay (Additional Minutes)
      description: Additional minutes to wait after First Light Target turns off before turning off Second Light Target (0 to 480 minutes / 8 hours).
      default: 5
      selector:
        number:
          min: 0
          max: 480
          unit_of_measurement: minutes
          mode: slider
    mode_lights:
      name: Mode / Always-On Lights (Optional)
      description: Accent or mode lights turned on with motion that remain ON when motion clears.
      default: {}
      selector:
        target:
          entity:
            domain: light
    flash_light:
      name: Occupancy Flash Alert Light (Optional)
      description: Select light target to flash when occupancy alert triggers. Leave empty to disable occupancy alert.
      default: {}
      selector:
        target:
          entity:
            domain: light
    occupancy_alert_interval:
      name: Occupancy Warning Interval (Minutes)
      description: >
        Minutes of continuous occupancy before flashing (Max 240 minutes / 4 hours). 
        ⚠️ WARNING: This value MUST be LESS THAN First Off Delay (delay_1), otherwise the alert will be ignored.
      default: 5
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: minutes
          mode: slider

mode: restart
max_exceeded: silent

variables:
  motion_sensors_var: !input motion_sensors
  mode_lights_var: !input mode_lights
  light_2_off_var: !input light_2_off
  flash_light_var: !input flash_light
  delay_1_var: !input delay_1
  occupancy_alert_interval_var: !input occupancy_alert_interval

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: 'on'
    id: motion_on
  - platform: state
    entity_id: !input motion_sensors
    to: 'off'
    id: motion_off
  - platform: state
    entity_id: !input motion_sensors
    to: 'on'
    for:
      minutes: !input occupancy_alert_interval
    id: occupancy_alert

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - action: light.turn_on
            target: !input target_lights
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ mode_lights_var != {} and mode_lights_var != none }}"
                sequence:
                  - action: light.turn_on
                    target: !input mode_lights

      - conditions:
          - condition: trigger
            id: motion_off
          - condition: template
            value_template: >
              {% if motion_sensors_var is string %}
                {{ is_state(motion_sensors_var, 'off') }}
              {% else %}
                {{ expand(motion_sensors_var) | selectattr('state', 'eq', 'on') | list | length == 0 }}
              {% endif %}
        sequence:
          - delay:
              minutes: !input delay_1
          - action: light.turn_off
            target: !input light_1_off
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ light_2_off_var != {} and light_2_off_var != none }}"
                sequence:
                  - delay:
                      minutes: !input delay_2
                  - action: light.turn_off
                    target: !input light_2_off
          - stop: "Automation completed after final light off delay."

      - conditions:
          - condition: trigger
            id: occupancy_alert
          - condition: template
            value_template: "{{ flash_light_var != {} and flash_light_var != none }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (occupancy_alert_interval_var | int) < (delay_1_var | int) }}"
                sequence:
                  - action: light.turn_off
                    target: !input flash_light
                  - delay:
                      seconds: 1
                  - action: light.turn_on
                    target: !input flash_light
            default:
              - action: system_log.write
                data:
                  level: warning
                  message: >
                    Occupancy Alert skipped: Occupancy Warning Interval ({{ occupancy_alert_interval_var }}m) 
                    must be LESS THAN First Off Delay ({{ delay_1_var }}m).
